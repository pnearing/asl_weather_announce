name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            debhelper \
            debhelper-compat \
            dh-python \
            fakeroot \
            python3-all \
            python3-setuptools \
            python3-requests \
            devscripts \
            lintian \
            git

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Remove 'v' prefix if present for Debian version
          DEB_VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "deb_version=$DEB_VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION (Debian: $DEB_VERSION)"

      - name: Update changelog version
        run: |
          DEB_VERSION="${{ steps.version.outputs.deb_version }}"
          # Update the changelog with the correct version
          sed -i "s/1.0.0-1/$DEB_VERSION-1/" debian/changelog
          # Update the date in changelog
          DATE=$(date -R)
          sed -i "s/Fri, 04 Apr 2026 18:45:00 -0400/$DATE/" debian/changelog

      - name: Build Debian package
        run: |
          # Build the package
          dpkg-buildpackage -us -uc -b
          # Move built packages to a known location
          mkdir -p ../artifacts
          mv ../*.deb ../artifacts/
          mv ../*.changes ../artifacts/ 2>/dev/null || true
          mv ../*.buildinfo ../artifacts/ 2>/dev/null || true

      - name: Show built packages
        run: |
          ls -la ../artifacts/
          dpkg-deb -I ../artifacts/*.deb || true

      - name: Create source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Create source tarball
          cd ..
          tar czf "artifacts/asl-weather-announce_${VERSION}.orig.tar.gz" \
            --exclude='.git' \
            --exclude='.forgejo' \
            --exclude='.github' \
            --exclude='debian' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.venv' \
            --transform "s|^asl_weather_announce|asl-weather-announce-${VERSION}|" \
            asl_weather_announce/
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debian-packages
          path: ../artifacts/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: debian-packages
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Forgejo Release
        uses: https://github.com/softprops/action-gh-release@master
        with:
          name: "ASL Weather Announce ${{ steps.version.outputs.version }}"
          files: |
            artifacts/*.deb
            artifacts/*.orig.tar.gz
          body: |
            ## ASL Weather Announce ${{ steps.version.outputs.version }}

            ### Debian Package
            - `.deb` file for Debian Trixie and compatible systems

            ### Source Archive
            - `.tar.gz` source archive for manual installation

            ### Installation
            ```bash
            # Download and install the .deb package
            sudo dpkg -i asl-weather-announce_*.deb
            sudo apt-get install -f  # Install any missing dependencies

            # Or install from source
            tar xzf asl-weather-announce_*.orig.tar.gz
            cd asl-weather-announce-*
            sudo make install
            ```

            ### Configuration
            Copy the example configuration and customize:
            ```bash
            sudo cp /etc/asl_weather.conf.example /etc/asl_weather.conf
            sudo nano /etc/asl_weather.conf
            ```
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, 'alpha') || contains(steps.version.outputs.version, 'beta') || contains(steps.version.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
